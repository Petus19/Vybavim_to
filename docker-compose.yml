# Development environment – start with: docker compose up -d
# The credentials below are for local development only.
# Host ports can be changed in .env (template: .env.example) if they are taken on your machine.
# Image versions are pinned so everyone has the same environment – change them only via a PR.

services:
  # --- Applications (planned: currently run with dotnet run / npm run dev) ---
  # web:         # Next.js – frontend
  # api:         # ASP.NET Core – REST API
  # worker:      # same code as api – background jobs
  # ai-service:  # Python / FastAPI (later)

  # --- Infrastructure ---
  db:
    build:
      context: .
      dockerfile_inline: |
        FROM postgres:17.11
        RUN apt-get update \
         && apt-get install -y --no-install-recommends postgresql-17-postgis-3 postgresql-17-pgvector \
         && rm -rf /var/lib/apt/lists/*
    environment:
      POSTGRES_USER: vybavim
      POSTGRES_PASSWORD: vybavim
      POSTGRES_DB: vybavim
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vybavim -d vybavim"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4.11
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data

  storage: # RustFS – S3-compatible file storage (S3 in production)
    image: rustfs/rustfs:1.0.1
    environment:
      RUSTFS_ACCESS_KEY: vybavim
      RUSTFS_SECRET_KEY: vybavim-dev
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
    ports:
      - "${STORAGE_PORT:-9000}:9000" # S3 API
      - "${STORAGE_CONSOLE_PORT:-9001}:9001" # web console
    volumes:
      - storage-data:/data

  mailpit:
    image: axllent/mailpit:v1.31.4
    ports:
      - "${SMTP_PORT:-2525}:1025" # SMTP (not 1025 – often taken on macOS, e.g. by Synology Drive)
      - "${MAILPIT_PORT:-8025}:8025" # web UI

volumes:
  db-data:
  redis-data:
  storage-data:
