# Vývojové prostredie – spustenie: docker compose up -d
# Prihlasovacie údaje nižšie sú iba pre lokálny vývoj.
# Porty na localhoste sa dajú zmeniť v súbore .env (vzor: .env.example), ak sú na počítači obsadené.
# Verzie image sú zafixované, aby sme mali všetci rovnaké prostredie – meniť iba vedome cez PR.

services:
  # --- Aplikácie (doplnia sa s kostrou backendu vo Fáze 0) ---
  # web:         # Next.js – frontend
  # api:         # ASP.NET Core – REST API + WebSockety
  # worker:      # rovnaký kód ako api – úlohy z fronty
  # ai-service:  # Python / FastAPI (neskôr)

  # --- Infraštruktúra ---
  db:
    build:
      context: .
      dockerfile_inline: |
        FROM postgres:17.11
        RUN apt-get update \
         && apt-get install -y --no-install-recommends postgresql-17-postgis-3 postgresql-17-pgvector \
         && rm -rf /var/lib/apt/lists/*
    environment:
      POSTGRES_USER: vybavim
      POSTGRES_PASSWORD: vybavim
      POSTGRES_DB: vybavim
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vybavim -d vybavim"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4.11
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data

  storage: # RustFS – S3-kompatibilné úložisko súborov (v produkcii S3)
    image: rustfs/rustfs:1.0.1
    environment:
      RUSTFS_ACCESS_KEY: vybavim
      RUSTFS_SECRET_KEY: vybavim-dev
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
    ports:
      - "${STORAGE_PORT:-9000}:9000" # S3 API
      - "${STORAGE_CONSOLE_PORT:-9001}:9001" # webová konzola
    volumes:
      - storage-data:/data

  mailpit:
    image: axllent/mailpit:v1.31.4
    ports:
      - "${SMTP_PORT:-2525}:1025" # SMTP (nie 1025 – ten na Macu obsadzuje napr. Synology Drive)
      - "${MAILPIT_PORT:-8025}:8025" # webové rozhranie

volumes:
  db-data:
  redis-data:
  storage-data:
