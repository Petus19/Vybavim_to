# Runs on every pull request and on every push to main.
# If any step fails, the pull request shows a red cross before it can be merged.

name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only access – the workflow changes nothing
permissions:
  contents: read

# A new commit in a PR cancels the previous, still running check
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (build + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET (version from global.json)
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: Backend/global.json

      - name: Restore packages
        run: dotnet restore Vybavim.slnx

      - name: Build (warnings as errors)
        run: dotnet build Vybavim.slnx --no-restore --configuration Release

      # Unit, architecture and integration tests. Integration tests start their own PostgreSQL
      # in Docker (Testcontainers) – Docker is preinstalled on the GitHub runner.
      - name: Tests
        run: dotnet test --no-build --configuration Release

  web:
    name: Web (lint + types + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend/Web
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node (version from .nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: Frontend/Web/.nvmrc
          cache: npm
          cache-dependency-path: Frontend/Web/package-lock.json

      - name: Install packages (exactly as in package-lock.json)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build
